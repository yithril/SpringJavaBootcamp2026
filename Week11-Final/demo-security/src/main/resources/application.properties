spring.application.name=campus-events

# In-memory H2 — no MySQL install or CREATE DATABASE needed
spring.datasource.url=jdbc:h2:mem:campus_events
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Optional: browse tables at http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:campus_events   User: sa   Password: (leave blank)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

jwt.secret=CampusEventsDemoSecretKeyForJwtSigningMustBeLongEnough123456
jwt.expiration-ms=86400000
